# Render Blueprint: one free web service that serves both the website and the API.
services:
  - type: web
    name: shorts-maker
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD
        sync: false        # Render asks you for this value when you create the service
      - key: WHISPER_MODEL
        value: tiny
      - key: WARM_WHISPER
        value: "0"         # keep memory low: load the caption model only when it is needed
      - key: MAX_WORKERS
        value: "1"         # one clip at a time on a small instance
